spring.application.name=pedidos
server.port=8082

# Oracle Autonomous DB (misma instancia que los otros microservicios, schema SL_PEDIDOS)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@yunjwge5ttypxb6i_medium?TNS_ADMIN=/opt/oracle/wallet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sl_pedidos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# JPA / Hibernate — el schema lo gestiona la BD (scripts SQL); Hibernate no toca el DDL
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=SL_PEDIDOS
spring.jpa.show-sql=false

# Actuator — expone /actuator/health para el healthcheck de Docker Compose
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.instances.pedidos.sliding-window-size=5
resilience4j.circuitbreaker.instances.pedidos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pedidos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pedidos.permitted-number-of-calls-in-half-open-state=3
# Un 404 de negocio no debe contar como fallo ni abrir el circuito
resilience4j.circuitbreaker.instances.pedidos.ignore-exceptions[0]=com.smartlogix.pedidos.exception.NotFoundException
